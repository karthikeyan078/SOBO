<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>AnatomyAssess</title>
    <style>
      :root {
        --bg: #f3f6f9;
        --c: #fff;
        --t: #14202e;
        --m: #5b6b7c;
        --b: #d9e0e8;
        --p: #0f766e;
        --pt: #fff;
        --ok: #15803d;
        --bad: #b91c1c;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0e141b;
          --c: #161e28;
          --t: #e6edf3;
          --m: #93a3b5;
          --b: #2a3644;
          --p: #2dd4bf;
          --pt: #06201d;
          --ok: #4ade80;
          --bad: #f87171;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0e141b;
        --c: #161e28;
        --t: #e6edf3;
        --m: #93a3b5;
        --b: #2a3644;
        --p: #2dd4bf;
        --pt: #06201d;
        --ok: #4ade80;
        --bad: #f87171;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--t);
        font:
          15px/1.5 Inter,
          system-ui,
          sans-serif;
      }
      header {
        display: flex;
        gap: 6px;
        align-items: center;
        padding: 10px 20px;
        background: var(--c);
        border-bottom: 1px solid var(--b);
        flex-wrap: wrap;
      }
      header b {
        font-size: 17px;
        margin-right: auto;
      }
      main {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
      }
      h1 {
        font-size: 24px;
        margin: 0 0 4px;
      }
      h2 {
        font-size: 18px;
        margin: 18px 0 8px;
      }
      button,
      select,
      input,
      textarea {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
        border: 1px solid var(--b);
        background: var(--c);
        border-radius: 8px;
        padding: 7px 14px;
      }
      button:hover {
        border-color: var(--p);
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible {
        outline: 2px solid var(--p);
        outline-offset: 2px;
      }
      .p {
        background: var(--p);
        color: var(--pt);
        border-color: var(--p);
        font-weight: 600;
      }
      .x {
        color: var(--bad);
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      input,
      select,
      textarea {
        width: 100%;
        padding: 7px 10px;
        border: 1px solid var(--b);
        border-radius: 8px;
        background: var(--c);
      }
      input[type="checkbox"],
      input[type="radio"] {
        width: auto;
      }
      .g {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 14px;
      }
      .card {
        background: var(--c);
        border: 1px solid var(--b);
        border-radius: 12px;
        padding: 16px;
      }
      .m {
        color: var(--m);
        font-size: 13px;
      }
      .st {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
        gap: 12px;
        margin: 14px 0;
      }
      .st .card b {
        font-size: 26px;
        display: block;
      }
      .pl {
        display: grid;
        grid-template-columns: minmax(0, 1.5fr) minmax(300px, 1fr);
        gap: 16px;
      }
      @media (max-width: 800px) {
        .pl {
          grid-template-columns: 1fr;
        }
      }
      .vw {
        position: relative;
        height: min(62vh, 560px);
        min-height: 300px;
        border-radius: 12px;
        overflow: hidden;
        background: #0b1220;
      }
      .vw canvas {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
      .ct {
        position: absolute;
        left: 8px;
        bottom: 8px;
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
      }
      .ct button {
        padding: 4px 9px;
        font-size: 12px;
        background: #1e293bcc;
        color: #e2e8f0;
        border-color: #334155;
      }
      .lb {
        position: absolute;
        top: 8px;
        left: 10px;
        color: #fbbf24;
        font-weight: 600;
        font-size: 13px;
      }
      .o {
        display: block;
        width: 100%;
        text-align: left;
        margin: 6px 0;
        padding: 10px 14px;
      }
      .o.s {
        border-color: var(--p);
        background: color-mix(in srgb, var(--p) 14%, var(--c));
      }
      .o.ok {
        border-color: var(--ok);
      }
      .o.no {
        border-color: var(--bad);
      }
      .fb {
        padding: 10px 14px;
        border-radius: 8px;
        margin: 10px 0;
        border: 1px solid var(--b);
      }
      .fb.ok {
        border-color: var(--ok);
      }
      .fb.no {
        border-color: var(--bad);
      }
      .ok-t {
        color: var(--ok);
      }
      .no-t {
        color: var(--bad);
      }
      .pr {
        height: 6px;
        background: var(--b);
        border-radius: 4px;
        overflow: hidden;
        margin: 8px 0;
      }
      .pr i {
        display: block;
        height: 100%;
        background: var(--p);
      }
      .qn {
        display: flex;
        gap: 5px;
        flex-wrap: wrap;
        margin: 8px 0;
      }
      .qn button {
        width: 34px;
        padding: 4px 0;
      }
      .qn .a {
        background: var(--p);
        color: var(--pt);
      }
      .qn .c {
        outline: 2px solid var(--t);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        background: var(--c);
        border-radius: 10px;
      }
      td,
      th {
        padding: 9px 12px;
        text-align: left;
        border-bottom: 1px solid var(--b);
      }
      tr.k {
        cursor: pointer;
      }
      tr.k:hover {
        background: var(--bg);
      }
      .big {
        font-size: 56px;
        font-weight: 700;
        text-align: center;
      }
      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }
      .sp {
        flex: 1;
      }
      label {
        display: block;
        font-weight: 600;
        margin: 10px 0 3px;
        font-size: 13px;
      }
      .tag {
        font-size: 12px;
        padding: 1px 8px;
        border: 1px solid var(--b);
        border-radius: 10px;
        color: var(--m);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js"></script>
    <script>
      const $ = (s) => document.querySelector(s),
        uid = () => Math.random().toString(36).slice(2, 9),
        now = () => new Date().toISOString();
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );
      const H = (s) => {
          let h = 0;
          for (const c of s) h = (h * 31 + c.charCodeAt(0)) | 0;
          return h;
        },
        sh = (a, k) => [...a].sort((x, y) => H(k + x) - H(k + y));
      const SYS = [
        "Skeletal",
        "Muscular",
        "Cardiovascular",
        "Respiratory",
        "Digestive",
        "Nervous",
        "Urinary",
      ];
      // ---- Anatomy data (swap ST + mesh builder for GLB: meshId must match mesh.name in the glTF) ----
      const ST = [
        [
          "skull",
          "Skull",
          "Skeletal",
          "Head",
          [0, 2.7, 0],
          [0.4, 0.4, 0.4],
          0xe5dcc5,
        ],
        [
          "brain",
          "Brain",
          "Nervous",
          "Head",
          [0, 3.1, 0],
          [0.33, 0.28, 0.33],
          0xf0a8b8,
        ],
        [
          "spine",
          "Spine",
          "Skeletal",
          "Back",
          [0, 0.6, -0.55],
          [0.12, 2.2, 0.12],
          0xd8cfb8,
          "c",
        ],
        [
          "left_lung",
          "Left Lung",
          "Respiratory",
          "Thorax",
          [0.8, 0.9, 0],
          [0.45, 0.8, 0.4],
          0x9ec5e8,
        ],
        [
          "right_lung",
          "Right Lung",
          "Respiratory",
          "Thorax",
          [-0.8, 0.9, 0],
          [0.45, 0.8, 0.4],
          0x9ec5e8,
        ],
        [
          "heart",
          "Heart",
          "Cardiovascular",
          "Thorax",
          [0.15, 0.8, 0.25],
          [0.5, 0.55, 0.35],
          0xa93226,
        ],
        [
          "left_atrium",
          "Left Atrium",
          "Cardiovascular",
          "Heart",
          [0.4, 1.05, 0.45],
          [0.17, 0.17, 0.17],
          0xe57373,
        ],
        [
          "right_atrium",
          "Right Atrium",
          "Cardiovascular",
          "Heart",
          [-0.1, 1.05, 0.45],
          [0.17, 0.17, 0.17],
          0x5c6bc0,
        ],
        [
          "left_ventricle",
          "Left Ventricle",
          "Cardiovascular",
          "Heart",
          [0.4, 0.6, 0.5],
          [0.19, 0.2, 0.17],
          0xd32f2f,
        ],
        [
          "right_ventricle",
          "Right Ventricle",
          "Cardiovascular",
          "Heart",
          [-0.05, 0.6, 0.5],
          [0.18, 0.2, 0.17],
          0x3949ab,
        ],
        [
          "liver",
          "Liver",
          "Digestive",
          "Abdomen",
          [-0.55, -0.1, 0.3],
          [0.7, 0.33, 0.4],
          0x8b4a2b,
        ],
        [
          "stomach",
          "Stomach",
          "Digestive",
          "Abdomen",
          [0.5, -0.1, 0.3],
          [0.38, 0.38, 0.3],
          0xe29a8a,
        ],
        [
          "left_kidney",
          "Left Kidney",
          "Urinary",
          "Abdomen",
          [0.4, -0.6, -0.25],
          [0.17, 0.3, 0.15],
          0x7a2e3a,
        ],
        [
          "right_kidney",
          "Right Kidney",
          "Urinary",
          "Abdomen",
          [-0.4, -0.6, -0.25],
          [0.17, 0.3, 0.15],
          0x7a2e3a,
        ],
      ];
      const nm = (id) =>
          (ST.find((s) => s[0] == id) || [, "(missing structure)"])[1],
        sysOf = (id) => (ST.find((s) => s[0] == id) || [, , "?"])[2];
      // ---- Viewer (API: cfg/reset/selectStructure/hide/show/isolate/resetVisibility/getSelected) ----
      const V = (() => {
        const el = document.createElement("div");
        el.className = "vw";
        let R;
        try {
          R = new THREE.WebGLRenderer({ antialias: true });
        } catch (e) {
          el.innerHTML =
            '<p style="color:#fff;padding:20px">3D unavailable: WebGL could not start.</p>';
        }
        const sc = new THREE.Scene();
        sc.background = new THREE.Color(0x0b1220);
        sc.add(new THREE.AmbientLight(0xffffff, 0.75));
        const dl = new THREE.DirectionalLight(0xffffff, 0.9);
        dl.position.set(3, 5, 6);
        sc.add(dl);
        const cam = new THREE.PerspectiveCamera(45, 1, 0.1, 100),
          M = {},
          grp = new THREE.Group();
        sc.add(grp);
        const ST0 = ST.slice(),
          ml = [],
          place = () =>
            ST0.forEach((s) => {
              const m = new THREE.Mesh(
                s[7]
                  ? new THREE.CylinderGeometry(1, 1, 1, 12)
                  : new THREE.SphereGeometry(1, 24, 16),
                new THREE.MeshStandardMaterial({ color: s[6], roughness: 0.6 }),
              );
              m.name = s[0];
              m.position.set(...s[4]);
              m.scale.set(...s[5]);
              m.userData.id = s[0];
              grp.add(m);
              M[s[0]] = m;
              ml.push(m);
            });
        place();
        const o = { th: 0, ph: 1.35, d: 9, t: new THREE.Vector3(0, 0.8, 0) },
          st = {
            sel: null,
            hov: null,
            hl: {},
            hid: new Set(),
            iso: null,
            pick: null,
            label: false,
          };
        let dirty = 1;
        const lb = document.createElement("div");
        lb.className = "lb";
        const ct = document.createElement("div");
        ct.className = "ct";
        const paint = () => {
          for (const id in M) {
            const m = M[id];
            m.visible = !st.hid.has(id) && (!st.iso || st.iso == id);
            const c =
              st.hl[id] ??
              (st.sel == id ? 0xf59e0b : st.hov == id ? 0x2563eb : 0);
            m.material.emissive.setHex(c);
            m.material.emissiveIntensity = 0.6;
          }
          lb.textContent = st.label && st.sel ? nm(st.sel) : "";
          dirty = 1;
        };
        const home = { t: new THREE.Vector3(0, 0.8, 0), d: 9 },
          reset = () => {
            o.th = 0;
            o.ph = 1.35;
            o.d = home.d;
            o.t.copy(home.t);
            dirty = 1;
          };
        const clear = () => {
          grp.clear();
          ml.length = 0;
          for (const k in M) delete M[k];
          ST.length = 0;
          st.sel = null;
          st.hov = null;
          st.hl = {};
          st.hid.clear();
          st.iso = null;
        };
        const restore = () => {
          clear();
          ST.push(...ST0);
          place();
          home.t.set(0, 0.8, 0);
          home.d = 9;
          reset();
          paint();
        };
        const load = (buf) =>
          new Promise((res, rej) =>
            new THREE.GLTFLoader().parse(
              buf,
              "",
              (g) => {
                clear();
                const seen = new Set();
                g.scene.traverse((m) => {
                  if (!m.isMesh) return;
                  let id = (m.name || "mesh")
                    .toLowerCase()
                    .trim()
                    .replace(/[^a-z0-9]+/g, "_");
                  while (seen.has(id)) id += "_";
                  seen.add(id);
                  const k = ST0.find((s) => s[0] == id);
                  ST.push(
                    k
                      ? [...k]
                      : [
                          id,
                          id
                            .replace(/_/g, " ")
                            .replace(/\b\w/g, (c) => c.toUpperCase()),
                          "Unassigned",
                          "Model",
                          [0, 0, 0],
                          [1, 1, 1],
                          0,
                        ],
                  );
                  const mt = m.material;
                  m.material = new THREE.MeshStandardMaterial({
                    color: mt && mt.color ? mt.color : 0xcccccc,
                    roughness: 0.6,
                    side: 2,
                  });
                  m.userData.id = id;
                  M[id] = m;
                  ml.push(m);
                });
                if (!ml.length) {
                  restore();
                  return rej(new Error("no meshes found"));
                }
                grp.add(g.scene);
                const b = new THREE.Box3().setFromObject(grp);
                b.getCenter(home.t);
                home.d = Math.max(
                  2,
                  b.getSize(new THREE.Vector3()).length() * 1.1,
                );
                cam.far = home.d * 20;
                cam.updateProjectionMatrix();
                reset();
                paint();
                res(ST.length);
              },
              (e) => rej(new Error(e.message || "parse error")),
            ),
          );
        const exportGLB = () => {
          api.cfg({});
          new THREE.GLTFExporter().parse(
            grp,
            (x) => {
              const a = document.createElement("a");
              a.href = URL.createObjectURL(
                new Blob([x], { type: "model/gltf-binary" }),
              );
              a.download = "anatomy-model.glb";
              a.click();
            },
            { binary: true },
          );
        };
        const api = {
          el,
          reset,
          load,
          restore,
          exportGLB,
          cfg(c) {
            st.hl = c.hl || {};
            st.sel = c.sel || null;
            st.pick = c.pick || null;
            st.label = !!c.label;
            st.hid.clear();
            st.iso = null;
            paint();
          },
          selectStructure(id) {
            st.sel = id;
            paint();
          },
          getSelected: () => st.sel,
          hideStructure(id) {
            st.hid.add(id);
            if (st.sel == id) st.sel = null;
            paint();
          },
          showStructure(id) {
            st.hid.delete(id);
            paint();
          },
          isolateStructure(id) {
            st.iso = id;
            paint();
          },
          resetVisibility() {
            st.hid.clear();
            st.iso = null;
            paint();
          },
        };
        [
          ["Reset view", reset, "Reset camera"],
          [
            "Hide",
            () => st.sel && api.hideStructure(st.sel),
            "Hide selected structure",
          ],
          [
            "Isolate",
            () => st.sel && api.isolateStructure(st.sel),
            "Isolate selected structure",
          ],
          ["Show all", api.resetVisibility, "Show all structures"],
        ].forEach(([t, f, a]) => {
          const b = document.createElement("button");
          b.textContent = t;
          b.title = a;
          b.setAttribute("aria-label", a);
          b.onclick = f;
          ct.appendChild(b);
        });
        if (R) {
          const c = R.domElement;
          el.append(c, lb, ct);
          let dn = null;
          const at = (e) => {
            const r = c.getBoundingClientRect(),
              v = new THREE.Vector2(
                ((e.clientX - r.left) / r.width) * 2 - 1,
                (-(e.clientY - r.top) / r.height) * 2 + 1,
              ),
              rc = new THREE.Raycaster();
            rc.setFromCamera(v, cam);
            const h = rc.intersectObjects(ml.filter((m) => m.visible))[0];
            return h ? h.object.userData.id : null;
          };
          c.onpointerdown = (e) => {
            c.setPointerCapture(e.pointerId);
            dn = { x: e.clientX, y: e.clientY, b: e.button, mv: 0 };
          };
          c.onpointermove = (e) => {
            if (dn) {
              const dx = e.clientX - dn.x,
                dy = e.clientY - dn.y;
              dn.x = e.clientX;
              dn.y = e.clientY;
              dn.mv += Math.abs(dx) + Math.abs(dy);
              if (dn.b == 2 || e.shiftKey) {
                cam.updateMatrix();
                const r = new THREE.Vector3().setFromMatrixColumn(
                    cam.matrix,
                    0,
                  ),
                  u = new THREE.Vector3().setFromMatrixColumn(cam.matrix, 1);
                o.t
                  .addScaledVector(r, -dx * o.d * 0.0015)
                  .addScaledVector(u, dy * o.d * 0.0015);
              } else {
                o.th -= dx * 0.008;
                o.ph = Math.min(3, Math.max(0.15, o.ph - dy * 0.008));
              }
              dirty = 1;
            } else {
              const h = at(e);
              if (h != st.hov) {
                st.hov = h;
                paint();
              }
            }
          };
          c.onpointerup = (e) => {
            if (dn && dn.mv < 5 && dn.b == 0) {
              const id = at(e);
              if (id) {
                st.sel = id;
                paint();
                st.pick && st.pick(id);
              }
            }
            dn = null;
          };
          c.oncontextmenu = (e) => e.preventDefault();
          c.addEventListener(
            "wheel",
            (e) => {
              e.preventDefault();
              o.d = Math.min(
                home.d * 2,
                Math.max(home.d * 0.25, o.d * (1 + e.deltaY * 0.001)),
              );
              dirty = 1;
            },
            { passive: false },
          );
          new ResizeObserver(() => {
            const w = el.clientWidth,
              h = el.clientHeight;
            if (w && h) {
              R.setSize(w, h, false);
              R.setPixelRatio(Math.min(devicePixelRatio, 2));
              cam.aspect = w / h;
              cam.updateProjectionMatrix();
              dirty = 1;
            }
          }).observe(el);
          (function loop() {
            if (dirty) {
              dirty = 0;
              cam.position.set(
                o.t.x + o.d * Math.sin(o.ph) * Math.sin(o.th),
                o.t.y + o.d * Math.cos(o.ph),
                o.t.z + o.d * Math.sin(o.ph) * Math.cos(o.th),
              );
              cam.lookAt(o.t);
              R.render(sc, cam);
            }
            requestAnimationFrame(loop);
          })();
        }
        paint();
        return api;
      })();
      // ---- Data / seed ----
      function sysO(s, k) {
        const c = sysOf(s),
          o = sh(
            SYS.filter((x) => x != c),
            k,
          )
            .slice(0, 3)
            .concat(c);
        return {
          options: sh(o, k + "z").map((x) => ({ id: x, text: x })),
          correctOptionId: c,
        };
      }
      function seed() {
        const Q = [],
          add = (q) => {
            q.id = uid();
            Q.push({
              difficulty: "easy",
              points: 1,
              tags: [],
              createdAt: now(),
              updatedAt: now(),
              ...q,
            });
            return q.id;
          };
        const I = (s, e) =>
            add({
              type: "identify_3d",
              title: "Identify the highlighted structure.",
              correctStructureId: s,
              explanation: e,
            }),
          F = (s, e) =>
            add({
              type: "find_structure",
              title: `Find the ${nm(s)}.`,
              correctStructureId: s,
              explanation: e,
              difficulty: "medium",
            }),
          Sy = (s) =>

          .join("")}</select>
<label>Question</label><input id="e_title" value="${esc(d.title)}">${mc ? `<label>Options (select the correct one)</label>${d.o.map((t, i) => `<div class="row"><input type="radio" name="co" value="${i}" ${i == d.co ? "checked" : ""} aria-label="Correct option ${i + 1}"><input class="eo" value="${esc(t)}" style="flex:1"></div>`).join("")}` : ""}
<div class="row"><div class="sp"><label>Difficulty</label><select id="e_df">${["easy", "medium", "hard"].map((x) => `<option ${x == d.df ? "selected" : ""}>${x}</option>`).join("")}</select></div><div class="sp"><label>Points</label><input id="e_pt" type="number" min="1" value="${d.pt}"></div></div><label>Explanation</label><textarea id="e_ex" rows="3">${esc(d.ex)}</textarea><label>Tags (comma separated)</label><input id="e_tg" value="${esc(d.tg)}"><p id="err" class="no-t" role="alert"></p><button class="p" onclick="saveQ()">Save question</button> <button onclick="dr=null;go('admin')">Cancel</button></div></div>`;
      }
      function sd() {
        const d = dr,
          g = (i) => $("#" + i)?.value;
        d.type = g("e_type") || d.type;
        d.title = g("e_title") ?? d.title;
        d.df = g("e_df") || d.df;
        d.pt = +g("e_pt") || 1;
        d.ex = g("e_ex") ?? d.ex;
        d.tg = g("e_tg") ?? d.tg;
        const eo = [...document.querySelectorAll(".eo")];
        if (eo.length) {
          d.o = eo.map((x) => x.value);
          d.co = +(document.querySelector("[name=co]:checked")?.value || 0);
        }
      }
      function saveQ() {
        sd();
        const d = dr,
          e = (m) => ($("#err").textContent = m);
        if (!d.title.trim()) return e("Enter a question.");
        const q = {
          id: d.id || uid(),
          type: d.type,
          title: d.title.trim(),
          difficulty: d.df,
          points: d.pt,
          explanation: d.ex,
          tags: d.tg
            .split(",")
            .map((x) => x.trim())
            .filter(Boolean),
          updatedAt: now(),
        };
        if (d.type == "multiple_choice") {
          const O = d.o
            .map((t, i) => ({ id: "o" + i, text: t.trim() }))
            .filter((o) => o.text);
          if (O.length < 2 || !O.some((o) => o.id == "o" + d.co))
            return e("Provide 2+ options and mark a non-empty one correct.");
          q.options = O;
          q.correctOptionId = "o" + d.co;
        } else {
          if (!d.cs) return e("Click a structure in the 3D model first.");
          q.correctStructureId = d.cs;
          if (d.type == "system_identification")
            Object.assign(q, sysO(d.cs, q.id));
        }
        const i = DB.Q.findIndex((x) => x.id == q.id);
        if (i >= 0) DB.Q[i] = { ...DB.Q[i], ...q };
        else DB.Q.push({ createdAt: now(), ...q });
        save();
        dr = null;
        go("admin");
      }
      let bd = null;
      function vBuild() {
        if (!bd || bd.src != S.p) {
          const z = S.p && DB.QZ.find((x) => x.id == S.p);
          bd = z
            ? { src: S.p, ...JSON.parse(JSON.stringify(z)) }
            : {
                src: S.p,
                title: "",
                description: "",
                dur: 15,
                pass: 70,
                fb: true,
                shuffle: false,
                questions: [],
              };
        }
        const b = bd,
          inn = b.questions.filter(qs);
        return `<h1>${b.id ? "Edit" : "Create"} quiz</h1><div class="card"><label>Title</label><input id="b_t" value="${esc(b.title)}"><div class="row"><div class="sp"><label>Duration (min, 0 = untimed)</label><input id="b_d" type="number" min="0" value="${b.dur}"></div><div class="sp"><label>Passing %</label><input id="b_p" type="number" min="0" max="100" value="${b.pass}"></div></div>
<label><input type="checkbox" id="b_f" ${b.fb ? "checked" : ""}> Immediate feedback</label><label><input type="checkbox" id="b_s" ${b.shuffle ? "checked" : ""}> Shuffle questions</label>
<h2>Questions in quiz (${inn.length})</h2>${inn.map((id, i) => `<div class="row"><span class="sp">${i + 1}. ${esc(qs(id).title)} <span class="tag">${esc(qs(id).correctStructureId ? nm(qs(id).correctStructureId) : "")}</span></span><button onclick="bm(${i},-1)">▲</button><button onclick="bm(${i},1)">▼</button><button class="x" onclick="bq('${id}')">Remove</button></div>`).join("") || '<p class="m">Empty.</p>'}
<h2>Add from bank</h2>${DB.Q.filter((q) => !b.questions.includes(q.id))
          .map(
            (q) =>
              `<div class="row"><span class="sp">${esc(q.title)} <span class="tag">${esc(q.correctStructureId ? nm(q.correctStructureId) : TY[q.type])}</span></span><button onclick="bq('${q.id}',1)">Add</button></div>`,
          )
          .join("")}
<p id="err" class="no-t" role="alert"></p><button class="p" onclick="saveB()">Save quiz</button> <button onclick="bd=null;go('admin')">Cancel</button></div>`;
      }
      function sb() {
        const g = (i) => $("#" + i),
          b = bd;
        if (!g("b_t")) return;
        b.title = g("b_t").value;
        b.dur = +g("b_d").value || 0;
        b.pass = +g("b_p").value || 0;
        b.fb = g("b_f").checked;
        b.shuffle = g("b_s").checked;
      }
      function bq(id, add) {
        sb();
        bd.questions = add
          ? [...bd.questions, id]
          : bd.questions.filter((x) => x != id);
        render();
      }
      function bm(i, d) {
        sb();
        const a = bd.questions.filter(qs),
          j = i + d;
        if (j < 0 || j >= a.length) return;
        [a[i], a[j]] = [a[j], a[i]];
        bd.questions = a;
        render();
      }
      function saveB() {
        sb();
        const b = bd;
        if (!b.title.trim()) {
          $("#err").textContent = "Enter a title.";
          return;
        }
        const q = b.questions.filter(qs);
        if (!q.length) {
          $("#err").textContent = "Add at least one question.";
          return;
        }
        const z = {
            id: b.id || uid(),
            title: b.title.trim(),
            description: b.description || "",
            dur: b.dur,
            pass: b.pass,
            fb: b.fb,
            shuffle: b.shuffle,
            questions: q,
            createdAt: b.createdAt || now(),
            updatedAt: now(),
          },
          i = DB.QZ.findIndex((x) => x.id == z.id);
        i >= 0 ? (DB.QZ[i] = z) : DB.QZ.push(z);
        save();
        bd = null;
        go("dash");
      }
      // resume a refreshed session
      const mstat = () =>
        ST.length + " structures: " + ST.map((s) => s[0]).join(", ");
      const idb = (m, v) =>
        new Promise((r) => {
          try {
            const q = indexedDB.open("ana", 1);
            q.onupgradeneeded = () => q.result.createObjectStore("k");
            q.onerror = () => r();
            q.onsuccess = () => {
              const s = q.result
                  .transaction("k", m == "get" ? "readonly" : "readwrite")
                  .objectStore("k"),
                x =
                  m == "get"
                    ? s.get("glb")
                    : m == "del"
                      ? s.delete("glb")
                      : s.put(v, "glb");
              x.onsuccess = () => r(x.result);
              x.onerror = () => r();
            };
          } catch (e) {
            r();
          }
        });
      async function upl(i) {
        const f = i.files[0];
        if (!f) return;
        try {
          const b = await f.arrayBuffer();
          await V.load(b);
          await idb("put", b);
          $("#mm").textContent = "Loaded. " + mstat();
        } catch (e) {
          $("#mm").textContent = "Could not load GLB: " + e.message;
        }
      }
      idb("get")
        .then((b) => b && V.load(b))
        .then(() => render())
        .catch(() => {});
      if (DB.cur) {
        S = { v: "play" };
      }
      render();
    </script>
  </body>
</html>
